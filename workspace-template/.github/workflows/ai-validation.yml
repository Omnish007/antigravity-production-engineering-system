# AI-Generated Change Validation
#
# This workflow validates AI-generated changes with the same rigor as human-authored code.
# Customize the tool commands, Node version, and database configuration for your project.

name: AI Change Validation

on:
  pull_request:
    branches: [main, develop, dev]
  push:
    branches: [main, develop, dev]

permissions:
  contents: read
  pull-requests: write

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Uncomment if your project requires MongoDB for integration tests:
    # services:
    #   mongodb:
    #     image: mongo:7
    #     ports:
    #       - 27017:27017

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check --if-present
        continue-on-error: false

      - name: Lint
        run: npm run lint --if-present
        continue-on-error: false

      - name: Type check
        run: npm run typecheck --if-present
        continue-on-error: false

      - name: Unit and integration tests
        run: npm test --if-present
        continue-on-error: false

      - name: Build
        run: npm run build --if-present
        continue-on-error: false

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high
        continue-on-error: false

      - name: Secret detection
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

      # Uncomment for CodeQL analysis:
