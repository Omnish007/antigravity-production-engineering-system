# AI-Generated Change Validation
#
# This workflow validates AI-generated changes with the same rigor as human-authored code.
#
# CUSTOMIZATION REQUIRED:
# - Update Node.js version to match your project's .nvmrc or engines field.
# - Update action SHAs when upgrading (use Dependabot or manual audit).
# - Uncomment E2E, CodeQL, or MongoDB sections as needed.

name: AI Change Validation

on:
  pull_request:
    branches: [main, develop, dev]
  push:
    branches: [main, develop, dev]

# Least-privilege permissions — only what the workflow actually needs.
permissions:
  contents: read

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Uncomment if your project requires MongoDB for integration tests:
    # services:
    #   mongodb:
    #     image: mongo:7
    #     ports:
    #       - 27017:27017

    steps:
      # Pin actions to full SHA for supply-chain security.
      # Update SHAs when upgrading; use Dependabot to automate.
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v7.0.0

      - name: Verify Node version configuration
        run: |
          if [ ! -f .nvmrc ] && ! node -e "const p=require('./package.json'); if(!p.engines||!p.engines.node) process.exit(1)" 2>/dev/null; then
            echo "::error::No .nvmrc file or package.json engines.node found."
            echo "Create a .nvmrc file with your desired Node version (e.g., '22') or add engines.node to package.json."
            echo "The workspace template ships with a .nvmrc containing Node 22 — if you removed it, recreate it."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@8f152de45cc393bb4806a77d70425d082269a84a # v7.0.0
        with:
          # Reads from .nvmrc (shipped with template) or package.json engines.
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check --if-present

      - name: Lint
        run: npm run lint --if-present

      - name: Type check
        run: npm run typecheck --if-present

      - name: Unit and integration tests
        run: npm test --if-present

      - name: Build
        run: npm run build --if-present

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v7.0.0
        with:
          fetch-depth: 0  # Full history for effective secret scanning

      - name: Setup Node.js
        uses: actions/setup-node@8f152de45cc393bb4806a77d70425d082269a84a # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      # Pin TruffleHog to a specific SHA for supply-chain safety.
      # Find the latest release SHA at: https://github.com/trufflesecurity/trufflehog/releases
      # Update this SHA periodically via Dependabot or manual audit.
      - name: Secret detection
        uses: trufflesecurity/trufflehog@b6dc520fb74ffa5a57bbb8cd8e3edce7273925ca # v3.88.0
        with:
          extra_args: --only-verified

      # Uncomment for CodeQL static analysis:
      # - name: Initialize CodeQL
      #   uses: github/codeql-action/init@v3
      #   with:
      #     languages: javascript-typescript
      #
      # - name: Perform CodeQL Analysis
      #   uses: github/codeql-action/analyze@v3

  # Uncomment and configure for E2E tests.
  # This job runs after quality-gates to avoid wasting E2E resources on code that fails basic checks.
