  #       uses: actions/setup-node@8f152de45cc393bb4806a77d70425d082269a84a # v7.0.0
  #       with:
  #         node-version-file: '.nvmrc'
  #         cache: 'npm'
  #
  #     - name: Install dependencies
  #       run: npm ci
  #
  #     - name: Install Playwright browsers
  #       run: npx playwright install --with-deps
  #
