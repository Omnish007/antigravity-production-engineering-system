# AI-Generated Change Validation

# This workflow validates AI-generated changes with the same rigor as human-authored code.

name: AI Change Validation

on:
  pull_request:
    branches: [main, develop, dev]
  push:
    branches: [main, develop, dev]

# Least-privilege permissions — only what the workflow actually needs.
permissions:
  contents: read

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Uncomment if your project requires MongoDB for integration tests:
    # services:
    #   mongodb:
    #     image: mongo:7
    #     ports:
    #       - 27017:27017

    steps:
      # Pin actions to full SHA for supply-chain security.
      # Update SHAs when upgrading; use Dependabot to automate.
      - name: Checkout
        uses: actions/checkout@3d3c4228965943b17469a47346124594c97970d4 # v7.0.1

      - name: Resolve Node.js version
        id: node-version
        run: |
          if [ -f .nvmrc ]; then
            echo "source=.nvmrc" >> "$GITHUB_OUTPUT"
            echo "Using Node.js version from .nvmrc: $(cat .nvmrc)"
          elif node -e "const p=require('./package.json'); if(p.engines && p.engines.node) { console.log(p.engines.node); process.exit(0); } process.exit(1);" 2>/dev/null; then
            # Extract version from package.json engines and write .nvmrc for setup-node
            node -e "const p=require('./package.json'); process.stdout.write(p.engines.node.replace(/[^0-9.]/g,''));" > .nvmrc
            echo "source=package.json engines.node" >> "$GITHUB_OUTPUT"
            echo "Using Node.js version from package.json engines: $(cat .nvmrc)"
          else
            echo "::error::No .nvmrc file or package.json engines.node found."
            echo "Create a .nvmrc file with your desired Node version (e.g., '24')."
            echo "The workspace template ships with a .nvmrc containing the current LTS — if you removed it, recreate it."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@8207627f1c9d2f23b2c286e10747864f1d7d0611 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check --if-present

      - name: Lint
        run: npm run lint --if-present

      - name: Type check
        run: npm run typecheck --if-present

      - name: Unit and integration tests
        run: npm test --if-present

      - name: Build
        run: npm run build --if-present

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c4228965943b17469a47346124594c97970d4 # v7.0.1
        with:
          fetch-depth: 0  # Full history for effective secret scanning

      - name: Resolve Node.js version
        run: |
          if [ -f .nvmrc ]; then
            echo "Using Node.js version from .nvmrc: $(cat .nvmrc)"
          elif node -e "const p=require('./package.json'); if(p.engines && p.engines.node) { console.log(p.engines.node); process.exit(0); } process.exit(1);" 2>/dev/null; then
            node -e "const p=require('./package.json'); process.stdout.write(p.engines.node.replace(/[^0-9.]/g,''));" > .nvmrc
          else
            echo "::error::No .nvmrc or package.json engines.node found."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@8207627f1c9d2f23b2c286e10747864f1d7d0611 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      # Pin TruffleHog to a specific SHA for supply-chain safety.
      # Find the latest release SHA at: https://github.com/trufflesecurity/trufflehog/releases
      # Update this SHA periodically via Dependabot or manual audit.
      - name: Secret detection
        uses: trufflesecurity/trufflehog@f714bf4083a30c00d603a110a28f8f1082c611ba # v3.97.5
        with:
          extra_args: --only-verified

      # Uncomment for CodeQL static analysis:
      # - name: Initialize CodeQL
      #   uses: github/codeql-action/init@v3
      #   with:
      #     languages: javascript-typescript
      #
      # - name: Perform CodeQL Analysis
      #   uses: github/codeql-action/analyze@v3

