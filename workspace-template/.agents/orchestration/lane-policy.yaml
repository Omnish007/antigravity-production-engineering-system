schemaVersion: "1.1.0"
title: "Portable Agent Execution Lane Policy"
description: "Authoritative machine-readable policy for execution mode, risk limits, ceremony, and required gates. Read-only inquiry is not a mutation lane."

modes:
  inquiry:
    description: "Read-only explanation, research, inspection, or codebase lookup with no repository mutation."
    mutationAllowed: false
    taskRegistrationRequired: false

lanes:
  fast:
    lane: "fast"
    tier: "Lane A"
    name: "Fast Low-Risk Governed Mutation"
    description: "Highly reversible, localized repository changes with bounded scope."
    trigger:
      taskTypes:
        - "simple"
        - "documentation"
        - "requirements"
      riskLevelMax: "low"
      reversibilityRequired: "HIGH"
      externalSideEffects: false
    riskLimits:
      maxFilesChanged: 3
      maxLinesChanged: 100
      destructiveOperations: false
      sensitiveTargetsAllowed: false
    taskRegistration:
      required: true
      canonicalTaskFile: true
      mode: "lightweight"
    requiredContext:
      mode: "targeted"
      maxBudgetTokens: 6000
    requiredGates:
      - "lint"
    approvalRequirements:
      externalApproval: false
      humanSignoff: false
    allowedSideEffects:
      filesystem: "scoped_workspace_mutation"
      network: "none"
      subagents: "none"
      destructiveCommands: "forbidden"
      productionChanges: "forbidden"
      controlPlaneMutation: "approval_required"

  standard:
    lane: "standard"
    tier: "Lane B"
    name: "Standard Governed Lifecycle"
    description: "Normal engineering work where the change is not high assurance."
    trigger:
      taskTypes:
        - "simple"
        - "bug"
        - "feature"
        - "refactor"
        - "database"
        - "testing"
        - "performance"
        - "documentation"
        - "requirements"
        - "investigation"
      riskLevelMax: "medium"
      externalSideEffects: "workspace_or_sandbox_only"
    riskLimits:
      maxFilesChanged: 25
      maxLinesChanged: 1500
      destructiveOperations: false
      sensitiveTargetsAllowed: false
    taskRegistration:
      required: true
      canonicalTaskFile: true
      mode: "standard"
    requiredContext:
      mode: "domain_specific"
      maxBudgetTokens: 16000
    requiredGates:
      - "lint"
      - "typecheck"
      - "test"
      - "build"
    approvalRequirements:
      externalApproval: false
      humanSignoff: false
    allowedSideEffects:
      filesystem: "workspace_mutation"
      network: "sandboxed"
      subagents: "specialized_workers_only"
      destructiveCommands: "forbidden"
      productionChanges: "forbidden"
      controlPlaneMutation: "approval_required"

  high_assurance:
    lane: "high_assurance"
    tier: "Lane C"
    name: "High Assurance Governed Lifecycle"
    description: "Full governance for high-impact, security-sensitive, irreversible, production, or externally side-effecting work."
    trigger:
      taskTypes:
        - "complex-feature"
        - "architecture"
        - "security"
        - "migration"
        - "deployment"
        - "infrastructure"
      riskLevelMin: "high"
      externalSideEffects: true
      lowReversibility: true
    riskLimits:
      maxFilesChanged: unlimited
      maxLinesChanged: unlimited
      destructiveOperations: false
      sensitiveTargetsAllowed: true
    taskRegistration:
      required: true
      canonicalTaskFile: true
      mode: "full_governance"
    requiredContext:
      mode: "exhaustive"
      maxBudgetTokens: 32000
    requiredGates:
      - "lint"
      - "typecheck"
      - "test"
      - "build"
      - "security"
      - "memorySync"
      - "diffReview"
      - "governanceValidation"
    approvalRequirements:
      externalApproval: true
      humanSignoff: true
    allowedSideEffects:
      filesystem: "governed_workspace_mutation"
      network: "isolated_and_explicit"
      subagents: "strictly_isolated"
      destructiveCommands: "explicit_approval_required"
      productionChanges: "explicit_approval_required"
      controlPlaneMutation: "explicit_approval_required"

overrides:
  - condition: "riskLevel in [high, critical]"
    minimumLane: "C"
  - condition: "externalSideEffects == true"
    minimumLane: "C"
  - condition: "reversibility == LOW"
    minimumLane: "C"
  - condition: "touches authentication, authorization, credentials, production data, financial logic, or destructive migration"
    minimumLane: "C"
